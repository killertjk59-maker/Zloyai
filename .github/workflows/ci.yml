name: CI

# Fast feedback on every push and pull request: analyse + test both halves of
# the project. Nothing here is allowed to fail silently — no `continue-on-error`
# anywhere, so a red build means a real red build.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flutter:
    name: Flutter analyse & test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true

      - name: Versions
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Static analysis
        run: flutter analyze

      - name: Unit & widget tests
        run: flutter test --reporter expanded

  backend:
    name: Backend lint, tests & smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Unit & API tests (no network, mock provider)
        run: python -m pytest -q

      - name: Boot the API and smoke-test it for real
        run: |
          set -euo pipefail
          # No OPENROUTER_API_KEY is set in CI, so this exercises the mock
          # provider path — exactly the "zero configuration" fallback users get.
          AI_PROVIDER=mock python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 --log-level warning &
          SERVER_PID=$!
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/v1/health >/dev/null; then break; fi
            sleep 1
          done
          ./scripts/smoke_test.sh http://127.0.0.1:8000
          kill "$SERVER_PID"

      - name: Confirm no secrets are committed
        working-directory: .
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)\.env$|\.env\.(local|production)$|key\.properties$|\.jks$|\.keystore$'; then
            echo "::error::A secret-bearing file is tracked by git."
            exit 1
          fi
          echo "No .env, keystore or key.properties files are tracked."
