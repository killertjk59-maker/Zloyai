# Render.com free-tier blueprint (no credit card needed at time of writing).
# Verify current limits yourself: free instances sleep when idle.
services:
  - type: web
    name: zloy-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: production
      - key: AI_PROVIDER
        value: auto
      - key: PYTHON_VERSION
        value: "3.12.7"
      # Set this in the Render dashboard. Never commit the value.
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: google/gemma-4-31b-it:free
