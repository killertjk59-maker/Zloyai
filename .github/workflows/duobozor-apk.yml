name: DuoBozor APK

# Сохтани APK-и воқеӣ барои барномаи DuoBozor (Expo SDK 51 / RN 0.74)
on:
  push:
    branches: [main]
    paths:
      - 'duobozor/mobile/**'
      - '.github/workflows/duobozor-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: duobozor/mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: duobozor/mobile/package-lock.json

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK (preinstalled on runner) + ndk/cmake
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SM" ] || SM=$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1)
          echo "sdkmanager=$SM"
          yes | "$SM" --licenses > /dev/null 2>&1 || true
          "$SM" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1" > /tmp/sdk.log 2>&1 || tail -30 /tmp/sdk.log
          ls "$SDK/ndk" 2>/dev/null || true

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Logic tests (tiyn ledger)
        run: npm test

      - name: UI render tests (screens + flows)
        run: npm run test:ui

      - name: Prebuild Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/duobozor-1.1.0.apk
          ls -lh out/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: duobozor-apk
          path: duobozor/mobile/out/duobozor-1.1.0.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish to Release (direct .apk link)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: duobozor-v1.0.0-${{ github.run_number }}
          name: DuoBozor APK v1.0.0 (build ${{ github.run_number }})
          body: |
            ### DuoBozor — APK
            - Гурӯҳхаридӣ (Pinduoduo), escrow, tj+ru
            - Build: `${{ github.run_number }}` · commit `${{ github.sha }}`
            - Насб: зеркашида, «Install unknown apps»-ро иҷозат диҳед.
          files: duobozor/mobile/out/duobozor-1.1.0.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
